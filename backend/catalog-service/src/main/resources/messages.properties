# ─────────────────────────────────────────────
#  Catalog Service — Validation Messages
#  Spring Boot resolves these automatically for
#  @NotBlank, @Size, @NotNull, @Min, @DecimalMin etc.
#  Format: {AnnotationName}.{objectName}.{fieldName}
# ─────────────────────────────────────────────

# Category
NotBlank.categoryRequest.name=Category name is required

# Course
NotBlank.courseRequest.title=Course title is required
NotNull.courseRequest.categoryId=A category must be selected for the course
NotNull.courseRequest.price=Price is required
DecimalMin.courseRequest.price=Price must be 0.00 or greater

# Lesson
NotBlank.lessonRequest.title=Lesson title is required
NotNull.lessonRequest.displayOrder=Display order is required
Min.lessonRequest.displayOrder=Display order must be at least 1

# Course Status
NotNull.courseStatusRequest.status=Course status is required
