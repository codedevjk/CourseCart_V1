# ─────────────────────────────────────────────
#  User Service — Validation Messages
#  Spring Boot resolves these automatically for
#  @NotBlank, @Size, @NotNull, @Email etc.
#  Format: {AnnotationName}.{objectName}.{fieldName}
# ─────────────────────────────────────────────

# Registration
NotBlank.userRegistrationRequest.name=Name is required
Size.userRegistrationRequest.name=Name must be at least 2 characters

NotBlank.userRegistrationRequest.username=Username is required
Size.userRegistrationRequest.username=Username must be at least 3 characters

NotBlank.userRegistrationRequest.password=Password is required
Size.userRegistrationRequest.password=Password must be at least 6 characters

# Login
NotBlank.userLoginRequest.username=Username is required
NotBlank.userLoginRequest.password=Password is required
