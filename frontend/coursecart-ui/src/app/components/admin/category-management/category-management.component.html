<div class="admin-header mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Category Management</h1>
    <button class="btn btn-primary" (click)="openCreateModal()">+ New Category</button>
  </div>
</div>

<app-error-state *ngIf="error" [message]="error" (retry)="loadCategories()"></app-error-state>

<!-- Form Section Modal -->
<div class="modal-overlay" *ngIf="showForm">
  <div class="admin-form-section modal-content">
    <h3 class="card-title">{{ isEditing ? 'Edit Category' : 'Create Category' }}</h3>
    <form (ngSubmit)="saveCategory()" #catForm="ngForm">
      
      <div class="form-group mb-3">
        <label class="form-label" for="name">Category Name</label>
        <input type="text" id="name" name="name" class="form-control" [(ngModel)]="currentCategory.name" required>
      </div>

      <div class="alert alert-danger" *ngIf="formError">{{ formError }}</div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="!catForm.valid">Save Category</button>
        <button type="button" class="btn btn-outline" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<app-loading-spinner *ngIf="isLoading" message="Loading categories..."></app-loading-spinner>

<div class="courses-list" *ngIf="!isLoading && categories.length > 0">
  <div class="admin-course-card" *ngFor="let category of categories">
    <div class="card-main category-card-main">
      <div class="course-info">
        
        <h3 class="course-title">{{ category.name }}</h3>
      </div>
      
      <div class="action-group">
        <button class="btn btn-outline-sm btn-icon-text" (click)="openEditModal(category)">
           Edit
        </button>
        <button class="btn btn-warning-outline btn-icon-text" (click)="deleteCategory(category.id)">
           Delete
        </button>
      </div>
    </div>
  </div>
</div>

<app-empty-state *ngIf="!isLoading && categories.length === 0 && !error" message="No categories found."></app-empty-state>

<!-- Confirmation Modal -->
<div class="modal-overlay" *ngIf="showConfirmModal">
  <div class="admin-form-section modal-content confirm-modal">
    <h3 class="card-title confirm-title">Confirm Action</h3>
    <p class="confirm-message">{{ confirmMessage }}</p>
    <div class="form-actions justify-content-center mt-4 confirm-actions">
      <button class="btn btn-outline" (click)="showConfirmModal = false">Cancel</button>
      <button class="btn btn-primary" (click)="executeConfirm()">OK</button>
    </div>
  </div>
</div>


  <!-- Alert Modal for Errors -->
  <div class="modal-overlay" *ngIf="showAlertModal">
    <div class="admin-form-section modal-content alert-modal">
      <h3 class="card-title text-danger alert-title">Action Failed</h3>
      <p class="alert-message">{{ alertMessage }}</p>
      <div class="form-actions justify-content-center mt-4">
        <button class="btn btn-primary px-4" (click)="showAlertModal = false">OK</button>
      </div>
    </div>
  </div>
